services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_DB: wozto_rag
      POSTGRES_USER: wozto
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - portable-rag-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wozto -d wozto_rag"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  portable-rag-data:

secrets:
  postgres_password:
    file: ${WOZTO_RAG_DB_PASSWORD_FILE:?WOZTO_RAG_DB_PASSWORD_FILE must point to a password-only file}
