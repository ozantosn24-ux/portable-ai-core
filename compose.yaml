services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-trixie
    environment:
      POSTGRES_DB: wozto_rag
      POSTGRES_USER: wozto
      POSTGRES_PASSWORD: ${WOZTO_RAG_DB_PASSWORD:?WOZTO_RAG_DB_PASSWORD must be set}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - portable-rag-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wozto -d wozto_rag"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  portable-rag-data:
